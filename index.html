<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>GPS Navi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e1a; --surface: #141929; --surface2: #1c2238;
    --text: #e8eaf0; --text-dim: #7a819a; --accent: #3b82f6;
    --green: #22c55e; --green-glow: rgba(34,197,94,0.2);
    --orange: #f59e0b; --red: #ef4444;
    --font: "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; z-index: 100; }
  .header-title { font-size: 17px; font-weight: 700; }
  .header-title span { color: var(--accent); }
  .header-btn { background: var(--surface2); border: 1px solid rgba(255,255,255,0.08); color: var(--text); width: 38px; height: 38px; border-radius: 10px; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .gps-status { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; color: var(--text-dim); background: var(--surface); border-bottom: 1px solid rgba(255,255,255,0.04); }
  .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .gps-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green-glow); animation: pulse 2s infinite; }
  .gps-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .next-point { margin: 16px; padding: 20px; background: linear-gradient(135deg, var(--surface2), var(--surface)); border: 1px solid rgba(59,130,246,0.2); border-radius: 14px; text-align: center; }
  .next-point-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .next-point-name { font-size: 26px; font-weight: 800; margin-bottom: 10px; line-height: 1.2; }
  .next-point-distance { font-size: 42px; font-weight: 800; color: var(--accent); line-height: 1; }
  .next-point-none { color: var(--text-dim); font-size: 15px; padding: 10px 0; }
  .section-label { font-size: 12px; color: var(--text-dim); padding: 0 16px; margin-bottom: 8px; }
  .point-list { padding: 0 16px 100px; display: flex; flex-direction: column; gap: 8px; }
  .point-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .point-index { width: 32px; height: 32px; background: var(--surface2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .point-info { flex: 1; min-width: 0; }
  .point-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .point-detail { font-size: 12px; color: var(--text-dim); }
  .point-dist { font-size: 18px; font-weight: 700; flex-shrink: 0; text-align: right; min-width: 60px; }
  .point-dist.far { color: var(--text-dim); }
  .point-dist.near { color: var(--orange); }
  .point-dist.arrived { color: var(--green); }
  .point-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .point-action-btn { background: var(--surface2); border: none; color: var(--text-dim); width: 32px; height: 32px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .point-action-btn.delete { color: var(--red); }
  .alert-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); animation: alertIn 0.3s ease-out; }
  @keyframes alertIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
  .alert-ring { width: 160px; height: 160px; border-radius: 50%; border: 4px solid var(--green); box-shadow: 0 0 40px var(--green-glow), 0 0 80px var(--green-glow); display: flex; align-items: center; justify-content: center; margin-bottom: 30px; animation: ringPulse 1.5s ease-in-out infinite; }
  @keyframes ringPulse { 0%,100%{box-shadow:0 0 40px var(--green-glow),0 0 80px var(--green-glow)} 50%{box-shadow:0 0 60px var(--green-glow),0 0 120px var(--green-glow)} }
  .alert-icon { font-size: 60px; }
  .alert-message { font-size: 40px; font-weight: 900; text-align: center; padding: 0 24px; line-height: 1.3; margin-bottom: 12px; }
  .alert-sub { font-size: 16px; color: var(--text-dim); margin-bottom: 40px; }
  .alert-dismiss { background: var(--surface2); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-size: 16px; font-weight: 600; padding: 14px 48px; border-radius: 12px; cursor: pointer; font-family: var(--font); }
  .modal-overlay { position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; padding: 24px 20px 36px; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 14px; font-size: 16px; color: var(--text); font-family: var(--font); outline: none; }
  .form-input:focus { border-color: var(--accent); }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }
  .form-help { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .btn-current-loc { background: var(--accent); border: none; color: #fff; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 16px; font-family: var(--font); }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font); border: none; }
  .modal-btn.cancel { background: var(--surface2); color: var(--text); }
  .modal-btn.save { background: var(--accent); color: #fff; }
  .tracking-toggle { margin: 16px; padding: 16px; background: var(--surface); border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.06); }
  .toggle-label { font-size: 15px; font-weight: 600; }
  .toggle-switch { width: 52px; height: 30px; background: var(--surface2); border-radius: 15px; border: none; position: relative; cursor: pointer; transition: background 0.2s; }
  .toggle-switch.on { background: var(--green); }
  .toggle-switch::after { content:''; position: absolute; width: 24px; height: 24px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.2s; }
  .toggle-switch.on::after { transform: translateX(22px); }
  .fab { position: fixed; bottom: 28px; right: 20px; width: 56px; height: 56px; background: var(--accent); border: none; border-radius: 16px; color: #fff; font-size: 28px; cursor: pointer; box-shadow: 0 4px 20px rgba(59,130,246,0.4); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .empty { text-align: center; padding: 50px 24px; color: var(--text-dim); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-text { font-size: 15px; line-height: 1.6; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 15px; font-weight: 500; }
  .settings-input { width: 80px; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--text); text-align: right; font-family: var(--font); outline: none; }
</style>
</head>
<body>
<div class="header">
  <div class="header-title"><span>GPS</span> Navi</div>
  <button class="header-btn" onclick="toggleSettings()">⚙</button>
</div>
<div class="gps-status">
  <div class="gps-dot" id="gps-dot"></div>
  <span id="gps-text">GPS停止中</span>
</div>
<div id="settings-panel" style="display:none; padding:16px;">
  <div class="settings-row">
    <span class="settings-label">通知距離（デフォルト）</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <input type="number" class="settings-input" id="set-radius" value="100" onchange="triggerRadius=parseInt(this.value)||100">
      <span style="color:var(--text-dim);font-size:14px;">m</span>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">読み上げテスト</span>
    <button class="header-btn" onclick="speak('テスト読み上げ。正常に動作しています。')" style="font-size:14px;">🔊</button>
  </div>
  <div class="settings-row">
    <span class="settings-label">全通知済みリセット</span>
    <button class="header-btn" onclick="alertedIds.clear()" style="font-size:14px;">↺</button>
  </div>
</div>
<div class="tracking-toggle">
  <span class="toggle-label">🛰 トラッキング</span>
  <button class="toggle-switch" id="toggle-tracking" onclick="toggleTracking()"></button>
</div>
<div class="next-point" id="next-point-box">
  <div class="next-point-none">トラッキングをオンにしてください</div>
</div>
<div id="point-list-section"></div>
<button class="fab" onclick="openAdd()">＋</button>
<div id="alert-container"></div>
<div id="modal-container"></div>

<script>
var points = [
  { id: 1, name: "車室10番", speech: "しゃしつ、じゅうばんです", lat: 0, lng: 0, radius: 100 },
  { id: 2, name: "サングラス注意", speech: "サングラス、ちゅうい", lat: 0, lng: 0, radius: 150 }
];
var currentPos = null;
var gpsStatus = 'stopped';
var tracking = false;
var watchId = null;
var alertedIds = new Set();
var triggerRadius = 100;
var modalOpen = false;

async function savePoints() { try { await window.storage.set('gps_navi_points', JSON.stringify(points)); } catch(e) {} }
async function loadPoints() { try { var r = await window.storage.get('gps_navi_points'); if(r&&r.value){var p=JSON.parse(r.value);if(Array.isArray(p)&&p.length)points=p;} } catch(e) {} }

function haversine(lat1,lng1,lat2,lng2) {
  var R=6371000,toRad=function(x){return x*Math.PI/180};
  var dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function formatDist(m){return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';}
function distClass(m){return m<=100?'arrived':m<=300?'near':'far';}

var audioUnlocked = false;
function unlockAudio() {
  if(audioUnlocked) return;
  if('speechSynthesis' in window){
    var u=new SpeechSynthesisUtterance('');
    u.volume=0; u.lang='ja-JP';
    speechSynthesis.speak(u);
  }
  var ctx = new (window.AudioContext||window.webkitAudioContext)();
  var buf = ctx.createBuffer(1,1,22050);
  var src = ctx.createBufferSource();
  src.buffer=buf; src.connect(ctx.destination); src.start(0);
  audioUnlocked=true;
}

function speak(text) {
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=0.9;u.volume=1;
  speechSynthesis.speak(u);
}

function toggleTracking(){if(tracking)stopTracking();else startTracking();}
function startTracking() {
  if(!navigator.geolocation){gpsStatus='error';updateGpsStatus();return;}
  unlockAudio();
  speak('トラッキングを開始します');
  tracking=true;gpsStatus='waiting';alertedIds.clear();
  updateToggle();updateGpsStatus();
  watchId=navigator.geolocation.watchPosition(
    function(pos){
      currentPos={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
      gpsStatus='active';
      updateGpsStatus();updateDistances();checkProximity();
    },
    function(){gpsStatus='error';updateGpsStatus();},
    {enableHighAccuracy:true,maximumAge:3000,timeout:10000}
  );
}
function stopTracking() {
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  tracking=false;gpsStatus='stopped';currentPos=null;alertedIds.clear();
  updateToggle();updateGpsStatus();updateDistances();
}
function checkProximity() {
  if(!currentPos)return;
  for(var i=0;i<points.length;i++){
    var pt=points[i];
    if(pt.lat===0&&pt.lng===0)continue;
    var d=haversine(currentPos.lat,currentPos.lng,pt.lat,pt.lng);
    var r=pt.radius||triggerRadius;
    if(d<=r&&!alertedIds.has(pt.id)){alertedIds.add(pt.id);showAlert(pt);break;}
    if(d>r*3)alertedIds.delete(pt.id);
  }
}

function updateGpsStatus() {
  var dot=document.getElementById('gps-dot');
  var txt=document.getElementById('gps-text');
  dot.className='gps-dot'+(gpsStatus==='active'?' active':gpsStatus==='error'?' error':'');
  txt.textContent=gpsStatus==='active'?'GPS取得中　精度 '+Math.round(currentPos?currentPos.acc:0)+'m'
    :gpsStatus==='error'?'GPS取得エラー':gpsStatus==='waiting'?'GPS信号を探しています…':'GPS停止中';
}
function updateToggle(){document.getElementById('toggle-tracking').className='toggle-switch'+(tracking?' on':'');}

function updateDistances() {
  if(modalOpen)return;
  var box=document.getElementById('next-point-box');
  var nearest=null,nearestDist=Infinity;
  for(var i=0;i<points.length;i++){
    var pt=points[i];
    if(!currentPos||(pt.lat===0&&pt.lng===0))continue;
    var d=haversine(currentPos.lat,currentPos.lng,pt.lat,pt.lng);
    if(d<nearestDist){nearestDist=d;nearest=pt;}
  }
  if(nearest){
    box.innerHTML='<div class="next-point-label">次の案内地点</div>'
      +'<div class="next-point-name">'+esc(nearest.name)+'</div>'
      +'<div class="next-point-distance">'+formatDist(nearestDist)+'</div>';
  } else {
    box.innerHTML='<div class="next-point-none">'+(points.length===0?'＋ボタンで地点を登録してください':tracking?'位置情報のある地点がありません':'トラッキングをオンにしてください')+'</div>';
  }
  for(var i=0;i<points.length;i++){
    var pt=points[i];
    var el=document.getElementById('dist-'+pt.id);
    if(!el)continue;
    if(!currentPos||(pt.lat===0&&pt.lng===0)){el.textContent='';el.className='point-dist';continue;}
    var d=haversine(currentPos.lat,currentPos.lng,pt.lat,pt.lng);
    el.textContent=formatDist(d);
    el.className='point-dist '+distClass(d);
  }
}

function renderPointList() {
  var section=document.getElementById('point-list-section');
  if(points.length===0){
    section.innerHTML='<div class="empty"><div class="empty-icon">📍</div><div class="empty-text">地点が登録されていません<br>右下の＋ボタンで追加できます</div></div>';
    return;
  }
  var html='<div class="section-label">登録地点</div><div class="point-list">';
  for(var i=0;i<points.length;i++){
    var pt=points[i];
    var hasCoords=pt.lat!==0||pt.lng!==0;
    html+='<div class="point-card">'
      +'<div class="point-index">'+(i+1)+'</div>'
      +'<div class="point-info">'
      +'<div class="point-name">'+esc(pt.name)+'</div>'
      +'<div class="point-detail">'+(hasCoords?pt.lat.toFixed(5)+', '+pt.lng.toFixed(5)+'　r='+(pt.radius||triggerRadius)+'m':'座標未設定')+'</div>'
      +'</div>'
      +'<div class="point-dist" id="dist-'+pt.id+'"></div>'
      +'<div class="point-actions">'
      +'<button class="point-action-btn" onclick="openEdit('+pt.id+')">✎</button>'
      +'<button class="point-action-btn delete" onclick="deletePoint('+pt.id+')">✕</button>'
      +'</div></div>';
  }
  html+='</div>';
  section.innerHTML=html;
  updateDistances();
}

var currentAlertSpeech = '';
function showAlert(point) {
  currentAlertSpeech = point.speech||point.name;
  document.getElementById('alert-container').innerHTML=
    '<div class="alert-overlay">'
    +'<div class="alert-ring"><div class="alert-icon">📍</div></div>'
    +'<div class="alert-message">'+esc(point.name)+'</div>'
    +'<div class="alert-sub">地点に到着しました</div>'
    +'<button class="alert-dismiss" onclick="speakAndDismiss()" style="margin-bottom:12px;">確認</button>'
    +'<button class="alert-dismiss" onclick="speak(currentAlertSpeech)" style="background:var(--accent);border-color:var(--accent);">🔊 もう一度読み上げ</button></div>';
  speak(currentAlertSpeech);
}
function speakAndDismiss(){speak(currentAlertSpeech);setTimeout(function(){document.getElementById('alert-container').innerHTML='';},500);}
function dismissAlert(){document.getElementById('alert-container').innerHTML='';}

function openAdd(){modalOpen=true;showModal({name:'',speech:'',lat:'',lng:'',radius:triggerRadius},false);}
function openEdit(id){var pt=points.find(function(p){return p.id===id});if(!pt)return;modalOpen=true;showModal(JSON.parse(JSON.stringify(pt)),true);}
function showModal(pt,isEdit) {
  document.getElementById('modal-container').innerHTML=
    '<div class="modal-overlay" onclick="closeModal()">'
    +'<div class="modal" onclick="event.stopPropagation()">'
    +'<div class="modal-handle"></div>'
    +'<div class="modal-title">'+(isEdit?'地点を編集':'新しい地点')+'</div>'
    +'<button class="btn-current-loc" onclick="fillCurrentLoc()">📍 現在地を使う</button>'
    +'<div class="form-group"><label class="form-label">表示名（画面に大きく表示される文字）</label>'
    +'<input class="form-input" id="f-name" value="'+esc(pt.name)+'" placeholder="車室10番"></div>'
    +'<div class="form-group"><label class="form-label">読み上げテキスト（空欄なら表示名を読みます）</label>'
    +'<input class="form-input" id="f-speech" value="'+esc(pt.speech||'')+'" placeholder="しゃしつ、じゅうばんです">'
    +'<div class="form-help">漢字より、ひらがなで書くと正確に読みます</div></div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label class="form-label">緯度</label>'
    +'<input class="form-input" id="f-lat" type="number" step="any" value="'+(pt.lat||'')+'" placeholder="35.6812"></div>'
    +'<div class="form-group"><label class="form-label">経度</label>'
    +'<input class="form-input" id="f-lng" type="number" step="any" value="'+(pt.lng||'')+'" placeholder="139.7671"></div></div>'
    +'<div class="form-group"><label class="form-label">通知距離（m）</label>'
    +'<input class="form-input" id="f-radius" type="number" value="'+(pt.radius||triggerRadius)+'" placeholder="100">'
    +'<div class="form-help">この距離以内に入ったら通知します</div></div>'
    +'<div class="modal-actions">'
    +'<button class="modal-btn cancel" onclick="closeModal()">キャンセル</button>'
    +'<button class="modal-btn save" onclick="saveModal('+(isEdit?pt.id:0)+')">'+(isEdit?'更新':'追加')+'</button>'
    +'</div></div></div>';
}
function closeModal(){modalOpen=false;document.getElementById('modal-container').innerHTML='';}
function fillCurrentLoc() {
  var setF=function(lat,lng){var la=document.getElementById('f-lat'),lo=document.getElementById('f-lng');if(la)la.value=lat.toFixed(6);if(lo)lo.value=lng.toFixed(6);};
  if(currentPos){setF(currentPos.lat,currentPos.lng);}
  else{navigator.geolocation.getCurrentPosition(function(pos){setF(pos.coords.latitude,pos.coords.longitude);},function(){alert('位置情報を取得できませんでした');});}
}
function saveModal(editId) {
  var name=document.getElementById('f-name').value.trim();
  if(!name){alert('表示名を入力してください');return;}
  var speech=document.getElementById('f-speech').value.trim();
  var lat=parseFloat(document.getElementById('f-lat').value)||0;
  var lng=parseFloat(document.getElementById('f-lng').value)||0;
  var radius=parseInt(document.getElementById('f-radius').value)||triggerRadius;
  if(editId){var pt=points.find(function(p){return p.id===editId});if(pt){pt.name=name;pt.speech=speech;pt.lat=lat;pt.lng=lng;pt.radius=radius;}}
  else{var maxId=points.reduce(function(m,p){return Math.max(m,p.id)},0);points.push({id:maxId+1,name:name,speech:speech,lat:lat,lng:lng,radius:radius});}
  savePoints();closeModal();renderPointList();
}
function deletePoint(id){if(confirm('この地点を削除しますか？')){points=points.filter(function(p){return p.id!==id});savePoints();renderPointList();}}
function toggleSettings(){var p=document.getElementById('settings-panel');p.style.display=p.style.display==='none'?'block':'none';}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

(async function(){await loadPoints();renderPointList();})();
</script>
</body>
</html>
